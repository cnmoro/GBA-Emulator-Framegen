name: Build & release APK

# Every push to main builds the APK. When versionName in app/build.gradle.kts
# has no release yet, a release vX.Y.Z is created with the APK attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components (runner's preinstalled Android SDK)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "GBA-FrameGen-$VER.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Check whether this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "NEW=false" >> "$GITHUB_ENV"
          else
            echo "NEW=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GBA-FrameGen-${{ env.VER }}
          path: GBA-FrameGen-*.apk

      - name: Publish release
        if: env.NEW == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: GBA FrameGen ${{ env.VER }}
          files: GBA-FrameGen-*.apk
          body: |
            GBA emulator for Android (mGBA core) with Lossless Scaling frame generation.

            **Install:** download the `.apk` below (arm64 Android, Vulkan 1.1+).

            **Frame generation:** import your own `Lossless.dll` (from your Lossless Scaling install on Steam) in the app — it is not distributed here. Optionally import `shaders/shaders_mali.zip` from this repo and pick it under Settings → Shaders.
